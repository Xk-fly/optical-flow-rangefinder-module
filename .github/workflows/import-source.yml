name: One-time source import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct clean source tree
        shell: bash
        run: |
          set -euo pipefail

          OVERLAY_B64="$RUNNER_TEMP/custom_overlay.b64"
          OVERLAY="$RUNNER_TEMP/custom_overlay.tar.gz"
          UPSTREAM="$RUNNER_TEMP/upstream"
          WORK="$RUNNER_TEMP/reconstructed"

          echo '802fdd22b867df1b68d7338aba2ac98412f99b0b11a2148021024d5b7071d3dd  _import/parts/part-00' | sha256sum -c -
          echo '250c245b5d5e8afb0113287a35d49f9d065667ea8c019adbfee3ee53ae1719bf  _import/parts/part-01' | sha256sum -c -
          echo '075d95d32ced5aabffa8b45506a9c0fd2402df7311c5ed9b7506e9dcaeb0fb85  _import/parts/part-02' | sha256sum -c -
          echo '58842f5b05af71f7c2dd9123a8f182d6bc33c858fbe75cab810abfb64adacd95  _import/parts/part-03' | sha256sum -c -
          echo '2fbfec8b65d437441d6b9c3cdfe25faa199087700f781aa8f1e8384614c3d627  _import/parts/part-04' | sha256sum -c -
          echo 'f2628c4447e098ef4a1b79752b1167df3d65c209dde3c52d778ecf516dba4ce3  _import/parts/part-05' | sha256sum -c -
          echo 'd9945901beb2b7b1406e9d7644e8210ce3dd1bc87016f52968f923705f4ec9dc  _import/parts/part-06' | sha256sum -c -
          echo '6f4700c9695f2f77fd53d8e53e47a3c1fa28ebc24f087d7c8456d068487ef75c  _import/parts/part-07' | sha256sum -c -
          echo 'abe2883332f1999289cab0163041d7e09e1884c16ad7891af88ffa0c435de11b  _import/parts/part-08' | sha256sum -c -
          echo '9fe3554833d0a0d1634731363099c7b84349180b35f9bd15fa71acf0dd71c332  _import/parts/part-09' | sha256sum -c -
          echo 'cec87a41a3b2e1a586e878db192b9b37203c8a5c347044b5e9a63003447d12e7  _import/parts/part-10' | sha256sum -c -

          cat _import/parts/part-* > "$OVERLAY_B64"
          echo "f9672cb3e5df715b987eb9c4ce976b77e315b831495d5879ce5160b7df36747f  $OVERLAY_B64" | sha256sum -c -
          base64 --decode "$OVERLAY_B64" > "$OVERLAY"
          echo "5c471e1164603f5cb3d8e9c9c8851b5a1d9e9a83b06202240f7f5d64683ef269  $OVERLAY" | sha256sum -c -

          git clone --depth 1 https://github.com/NanoNM/F_Flow-01.git "$UPSTREAM"
          mkdir -p "$WORK"

          cp -a "$UPSTREAM/Core" "$WORK/"
          cp -a "$UPSTREAM/Drivers" "$WORK/"
          cp -a "$UPSTREAM/.cproject" "$WORK/"
          cp -a "$UPSTREAM/.mxproject" "$WORK/"
          cp -a "$UPSTREAM/.project" "$WORK/"
          cp -a "$UPSTREAM/.settings" "$WORK/"
          cp -a "$UPSTREAM/STM32G030F6P6TR Debug.launch" "$WORK/"
          cp -a "$UPSTREAM/STM32G030F6P6TR.ioc" "$WORK/"
          cp -a "$UPSTREAM/STM32G030F6PX_FLASH.ld" "$WORK/"
          cp -a "$UPSTREAM/LICENSE" "$WORK/"

          tar -xzf "$OVERLAY" -C "$WORK"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$WORK"/. .

      - name: Verify imported source
        shell: bash
        run: |
          set -euo pipefail

          echo 'd884fdbf70f12928e4f845a5a47015d1f9f4cbb066ae13312f4b920fbdfc5990  Core/Src/main.c' | sha256sum -c -
          echo 'f7b33231ef597ac4a1fe4a1419b4faab7b36a2280f2e0d5a0397e2322c21bdd7  Core/Src/PMW3901MB/pmw_3901.c' | sha256sum -c -
          echo '51cd968f02aa5cbc85bbcaa1d7d00507a1a6b3c65eb3dc12381d3717f665c129  Core/Src/Adapter/massage_adapter.c' | sha256sum -c -
          echo 'f8fc25404a22425937778538d92d4f364d2e3faef012a2747b174633891d5d53  STM32G030F6P6TR.ioc' | sha256sum -c -
          echo '8ca7feb9ab557085536928314cfcb4fd6fb89364e3c9f3516edbe5e3ddfdd0ab  光流模块原理图和PCB/光流原理图与PCB整体.epro' | sha256sum -c -

          python tools/verify_pmw3901_driver.py
          python tools/verify_production_firmware.py
          python tools/test_monitor_mavlink_serial.py

      - name: Commit reconstructed repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import optical flow rangefinder module source'
          git push origin HEAD:main
