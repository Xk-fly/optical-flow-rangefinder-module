name: build F-Flow HL5300

on:
  push:
    branches:
      - feature/hl5300-rangefinder

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:v0.1.3
    steps:
      - uses: actions/checkout@v4
      - name: Set up ARM GCC
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo /opt/gcc-arm-none-eabi-10/bin >> "$GITHUB_PATH"
      - name: Check optical-flow source
        run: python3 tools/verify_pmw3901_driver.py
      - name: Build STM32G030F6 firmware
        shell: bash
        run: |
          set -euo pipefail
          sed 's/ (READONLY)//g' STM32G030F6PX_FLASH.ld > /tmp/hl5300-flash.ld
          make BUILD_DIR=build-ci LDSCRIPT=/tmp/hl5300-flash.ld -j2 all
          arm-none-eabi-nm build-ci/STM32G030F6P6TR.elf > /tmp/hl5300-symbols.txt
          grep -w hl5300_firmware /tmp/hl5300-symbols.txt
          grep -w hl5300_read_distance /tmp/hl5300-symbols.txt
          mkdir firmware
          cp build-ci/STM32G030F6P6TR.hex firmware/F-FLOW-HL5300.hex
          cp build-ci/STM32G030F6P6TR.bin firmware/F-FLOW-HL5300.bin
          (
            cd firmware
            echo "commit=$GITHUB_SHA"
            arm-none-eabi-size ../build-ci/STM32G030F6P6TR.elf
            sha256sum F-FLOW-HL5300.hex F-FLOW-HL5300.bin
          ) | tee firmware/BUILD_INFO.txt
      - name: Upload flashable firmware
        uses: actions/upload-artifact@v4
        with:
          name: F-FLOW-HL5300-${{ github.sha }}
          path: firmware/
          if-no-files-found: error
          retention-days: 30
